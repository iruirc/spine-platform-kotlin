# The versions spine-platform-kotlin's skills pin, and the ones scripts/compile-snippets.sh builds against.
# A skill teaches the current stable major and names the previous one only under "Migrating from X",
# at most 8 lines. Room is the exception: 2.x stays pinned while most projects are on it.
