openapi: 3.0.3
info:
  title: Orders
  version: "1"
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
    post:
      operationId: createOrder
      tags: [Orders]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDraft" }
      responses:
        "201":
          description: The placed order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [Orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
components:
  schemas:
    Order:
      type: object
      required: [id, total, currency]
      properties:
        id: { type: string }
        total: { type: string }
        currency: { type: string }
    OrderDraft:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: string } }
    OrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        next: { type: string }
